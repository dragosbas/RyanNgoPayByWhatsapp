name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goodfund
          POSTGRES_PASSWORD: goodfund
          POSTGRES_DB: goodfund
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodfund -d goodfund"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://goodfund:goodfund@localhost:5432/goodfund
      RATE_LIMIT_MAX: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
